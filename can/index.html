<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Testing</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/can/images/letter-7075493.png"
    />
    
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@200;400;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- MapLibre CSS -->
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    
    <!-- Deck.gl (standalone bundle) -->
    <script src="https://unpkg.com/deck.gl/dist.min.js"></script>

    <!-- Basic Internal CSS -->
    <style>
      /* Reset body and html to take up exact window size with no scrolling */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Noto Sans', sans-serif;
        background-color: #1e1e1e; /* Fallback color before map loads */
        color: #f0f0f0;
      }

      /* Map container takes over the entire screen behind the UI */
      #globe-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1; 
      }

      /* Invisible overlay to hold the text above the map */
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        
        /* This allows mouse clicks/drags to pass through to the map underneath */
        pointer-events: none; 
      }

      /* Text elements get pointer-events back so you can still highlight text */
      h1, p {
        pointer-events: auto; 
        background: rgba(30, 30, 30, 0.6); /* Dark translucent background for readability */
        backdrop-filter: blur(4px); /* Blurs the map slightly behind the text */
        padding: 10px 20px;
        border-radius: 8px;
        margin: 10px 0;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-weight: 700;
        color: #00ffff;
      }

      p {
        font-weight: 200;
        font-size: 1.1rem;
        max-width: 800px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- The Map -->
    <div id="globe-container"></div>
    
    <!-- The UI Overlay -->
    <div id="ui-overlay">
      <h1>Heading yay nice</h1>
      <p>Here is the text</p>
      <p>Here is more text</p>
    </div>
    
    <script type="module">
      // 1. Import maplibregl and the PMTiles protocol
      import * as maplibregl from 'https://unpkg.com/maplibre-gl/dist/maplibre-gl.mjs';
      import { Protocol } from 'https://unpkg.com/pmtiles@3/dist/index.js';

      // === YOUR CONFIGURATION ===
      const BASEMAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
      const INITIAL_CENTER = [-111.83, 40.62]; // Longitude, Latitude
      const INITIAL_ZOOM = 1.5;

      // NEW: Dynamically build the absolute URL from your relative folder structure.
      const PMTILES_URL = new URL('./files/converted.pmtiles', window.location.href).href;
      // ==========================

      // 2. Register the PMTiles protocol BEFORE initializing the map
      const protocol = new Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      // 3. Initialize the MapLibre base map
      const map = new maplibregl.Map({
          container: 'globe-container',
          style: BASEMAP_STYLE,
          center: INITIAL_CENTER,
          zoom: INITIAL_ZOOM
      });

      // 4. Wait for the Carto style to load, force globe, then add PMTiles
      map.on('style.load', () => {
          map.setProjection({
              type: 'globe'
          });

          // Add the PMTiles source using the custom pmtiles:// prefix
          map.addSource('my-pmtiles-source', {
              type: 'vector',
              url: `pmtiles://${PMTILES_URL}`
          });

          // Add the map layer pointing to your source
          map.addLayer({
              id: 'my-pmtiles-layer',
              type: 'fill',
              source: 'my-pmtiles-source',
              'source-layer': 'continents_data', // Update this to match your PMTiles internal layer name!
              paint: {
                  'fill-color': '#00ffff',
                  'fill-opacity': 0.4,
                  'fill-outline-color': '#ffffff'
              }
          });
      });

      // 5. Initialize the deck.gl overlay
      const deckOverlay = new deck.MapboxOverlay({
          interleaved: true,
          layers: []
      });

      // 6. Attach deck.gl to the map
      map.addControl(deckOverlay);
    </script>
  </body>
</html>
