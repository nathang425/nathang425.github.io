<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Anti-Scraping / Anti-AI Bot Meta Tags -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />

    <title>Map Testing</title>
    
    <!-- Google Fonts: Ibarra Real Nova and Source Sans Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:wght@400;700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <!-- MapLibre CSS -->
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Basic Internal CSS -->
    <style>
      /* =========================================
         THEME VARIABLES (Edit these to update site)
         ========================================= */
      :root {
        --background-color: #FAF0E0;
        --color-01: #BA4B23;
        --color-02: #805938;
        --color-body: #221911;

        --font-head: 'Ibarra Real Nova', serif;
        --font-body: 'Source Sans Pro', sans-serif;
      }

      /* =========================================
         TYPOGRAPHY & TEXT TAGS
         ========================================= */
      html, body {
        font-family: var(--font-body);
        color: var(--color-body);
        background-color: var(--background-color);
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden;
      }

      h1 {
        font-family: var(--font-head);
        color: var(--color-01);
        font-size: 2.5rem; /* Largest "title" size */
        font-weight: 700;
        margin: 0;
      }

      h2 {
        font-family: var(--font-head);
        color: var(--color-02);
        font-size: 1.8rem; /* Medium size */
        font-weight: 700;
        margin: 0;
      }

      h3 {
        font-family: var(--font-body);
        color: var(--color-02);
        font-size: 1rem; /* Body size */
        text-transform: uppercase;
        font-weight: 700;
        margin: 0;
      }

      h4 {
        font-family: var(--font-body);
        color: var(--color-02);
        font-size: 1rem; /* Body size */
        font-weight: 400;
        margin: 0;
      }

      /* =========================================
         LAYOUT & COMPONENT STYLES
         ========================================= */
      #globe-container {
        position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; 
      }

      #ui-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2; pointer-events: none; 
      }

      /* Specific layout overrides for the main map title (H1) */
      #ui-overlay h1 {
        pointer-events: auto; 
        background: var(--background-color); 
        padding: 10px 20px; border-radius: 8px; margin: 20px auto;
        text-align: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: fit-content; 
        border: 1px solid var(--color-02);
      }

      #side-buttons {
        position: absolute; top: 50%; left: 20px;
        transform: translateY(-50%); display: flex;
        flex-direction: column; gap: 15px;
      }

      .sq-btn {
        pointer-events: auto; width: 50px; height: 50px;
        border-radius: 12px; 
        background: var(--background-color);
        border: 1px solid var(--color-02); 
        color: var(--color-01); 
        font-family: var(--font-body);
        font-size: 1.2rem;
        font-weight: 700; cursor: pointer; 
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: background 0.2s, transform 0.1s;
        display: flex; align-items: center; justify-content: center;
      }

      .sq-btn:hover { border-color: var(--color-01); }
      .sq-btn:active { transform: scale(0.95); }

      /* Fullscreen About Overlay */
      #about-overlay {
        position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        background: var(--background-color); z-index: 10; display: none;
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; pointer-events: auto;
      }
      #about-overlay h2 { margin-bottom: 20px; }
      #about-overlay p { font-size: 1.2rem; max-width: 600px; line-height: 1.6; margin-bottom: 30px; padding: 0 20px; }
      #close-about-btn { position: absolute; top: 30px; right: 30px; background: none; border: none; color: var(--color-02); font-size: 2rem; cursor: pointer; transition: color 0.2s; }
      #close-about-btn:hover { color: var(--color-01); }

      /* Interactive Info Panel */
      #info-panel {
        position: absolute;
        z-index: 5;
        background: var(--background-color);
        border: 1px solid var(--color-02);
        color: var(--color-body);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        pointer-events: auto;
        /* Note: removed height transition, we only animate transform now! */
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #drag-handle {
        width: 40px;
        height: 5px;
        background: var(--color-02);
        border-radius: 3px;
        margin: 12px auto;
        display: none; /* Only visible on mobile */
        flex-shrink: 0;
        cursor: pointer;
        touch-action: none;
      }

      #close-panel-btn {
        position: absolute;
        top: 12px;
        right: 15px;
        background: none;
        border: none;
        color: var(--color-02);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 5px;
      }
      #close-panel-btn:hover { color: var(--color-01); }

      #info-content {
        padding: 20px;
        overflow-y: hidden; /* Disabled until fully expanded */
        scrollbar-width: thin;
        scrollbar-color: var(--color-02) transparent;
        touch-action: pan-y;
        flex: 1; /* Ensure it takes up remaining sheet space */
      }

      /* Custom Overlay Scrollbar using var(--color-02) */
      #info-content::-webkit-scrollbar {
        width: 6px;
      }
      #info-content::-webkit-scrollbar-track {
        background: transparent;
      }
      #info-content::-webkit-scrollbar-thumb {
        background-color: var(--color-02);
        border-radius: 10px;
      }

      .popup-title {
        margin: 0 0 15px 0; 
        border-bottom: 1px solid var(--color-02); 
        padding-bottom: 8px;
      }
      .popup-stat { margin: 10px 0; font-size: 1.05rem; }
      .popup-stat strong { color: var(--color-01); }

      /* Desktop/Tablet View (Sidebar) */
      @media (min-width: 768px) {
        #info-panel {
          top: 20px; right: 20px; bottom: 20px; width: 350px;
          border-radius: 16px;
          transform: translateX(120%);
        }
        #info-panel.open { transform: translateX(0); }
        #info-content { overflow-y: auto; }
      }

      /* Mobile View (Bottom Sheet) */
      @media (max-width: 767px) {
        #info-panel {
          bottom: 0; left: 0; width: 100vw; 
          height: 80vh; /* It is ALWAYS 80vh tall now! */
          border-radius: 24px 24px 0 0; border-bottom: none;
          transform: translateY(100%); /* Base closed state */
        }
        #info-panel.open { 
          /* 80vh (total) - 55vh (translate down) = 25vh visible */
          transform: translateY(55vh); 
        }
        #info-panel.expanded {
          /* Fully pulled up */
          transform: translateY(0);
        }
        #drag-handle { display: block; }
        #close-panel-btn { display: none; }
        #info-content { 
          padding-top: 5px;
          overflow-y: hidden;
        }
        #info-panel.expanded #info-content {
          overflow-y: auto; /* Enable scrollbar ONLY when fully pulled up */
        }
      }
    </style>
  </head>
  <body>
    <!-- The Map -->
    <div id="globe-container"></div>
    
    <!-- The UI Overlay -->
    <div id="ui-overlay">
      <h1>Heading yay nice</h1>

      <div id="side-buttons">
        <button id="btn-north" class="sq-btn" title="North Up">N</button>
        <button id="btn-proj" class="sq-btn" title="Toggle Projection">2D</button>
        <button id="btn-about" class="sq-btn" title="About">i</button>
      </div>
    </div>

    <!-- NEW: Interactive Info Panel (Sidebar / Bottom Sheet) -->
    <div id="info-panel">
      <div id="drag-handle"></div>
      <button id="close-panel-btn" title="Close">✕</button>
      <div id="info-content">
        <!-- Content gets injected here by JavaScript -->
      </div>
    </div>

    <!-- Fullscreen About Overlay -->
    <div id="about-overlay">
      <button id="close-about-btn" title="Close">✕</button>
      <h2>About This Map</h2>
      <p>Welcome to the map! This space is reserved for information about the project, the data sources, or any other details you want to share.</p>
    </div>
    
    <script type="module">
      import * as maplibregl from 'https://unpkg.com/maplibre-gl/dist/maplibre-gl.mjs';
      import { Protocol } from 'https://unpkg.com/pmtiles@3/dist/index.js';

      /* Grab colors from CSS Variables to use in Map layers dynamically */
      const rootStyles = getComputedStyle(document.documentElement);
      const primaryColor = rootStyles.getPropertyValue('--color-01').trim() || '#BA4B23';
      const bgColor = rootStyles.getPropertyValue('--background-color').trim() || '#FAF0E0';

      const BASEMAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
      const INITIAL_CENTER = [-111.83, 40.62];
      const INITIAL_ZOOM = 1.5;

      const PMTILES_URL = new URL('./files/converted.pmtiles', window.location.href).href;
      const DATA_URL = new URL('./files/continent_data.json', window.location.href).href;
      
      let mapData = {};
      fetch(DATA_URL)
        .then(response => response.json())
        .then(data => { mapData = data; })
        .catch(err => console.error("Error loading external data:", err));

      const protocol = new Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      const map = new maplibregl.Map({
          container: 'globe-container',
          style: BASEMAP_STYLE,
          center: INITIAL_CENTER,
          zoom: INITIAL_ZOOM
      });

      map.on('style.load', () => {
          map.setProjection({ type: 'globe' });
          map.addSource('my-pmtiles-source', { type: 'vector', url: `pmtiles://${PMTILES_URL}` });
          map.addLayer({
              id: 'my-pmtiles-layer',
              type: 'fill',
              source: 'my-pmtiles-source',
              'source-layer': 'continents_data', 
              paint: {
                  'fill-color': primaryColor,
                  'fill-opacity': 0.4,
                  'fill-outline-color': bgColor 
              }
          });
      });

      // === PANEL LOGIC ===
      const infoPanel = document.getElementById('info-panel');
      const infoContent = document.getElementById('info-content');
      const closePanelBtn = document.getElementById('close-panel-btn');

      function openPanel(htmlContent) {
          infoContent.innerHTML = htmlContent;
          infoPanel.classList.add('open');
          infoPanel.classList.remove('expanded');
          // Clear any inline styles so the CSS classes take over
          infoPanel.style.transform = ''; 
          infoContent.scrollTop = 0;
      }

      function closePanel() {
          infoPanel.classList.remove('open', 'expanded');
          infoPanel.style.transform = ''; 
      }

      closePanelBtn.addEventListener('click', closePanel);

      map.on('click', (e) => {
          const features = map.queryRenderedFeatures(e.point, { layers: ['my-pmtiles-layer'] });
          if (!features.length) {
              closePanel();
          }
      });

      map.on('mouseenter', 'my-pmtiles-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'my-pmtiles-layer', () => { map.getCanvas().style.cursor = ''; });

      map.on('click', 'my-pmtiles-layer', (e) => {
          if (!e.features || e.features.length === 0) return;
          
          const feature = e.features[0];
          const name = feature.properties.CONTINENT || feature.properties.name || "Unknown";
          
          const data = mapData[name] || {
              "Population": "Data unavailable",
              "Area": "Data unavailable",
              "Countries": "N/A"
          };

          const panelHtml = `
              <h3 class="popup-title">${name}</h3>
              <p class="popup-stat"><strong>Population:</strong> ${data.Population}</p>
              <p class="popup-stat"><strong>Area:</strong> ${data.Area}</p>
              <p class="popup-stat"><strong>Countries:</strong> ${data.Countries}</p>
          `;
          
          openPanel(panelHtml);
      });

      // === MOBILE TOUCH DRAG LOGIC (Bottom Sheet) ===
      let startY = 0;
      let startTranslateY = 0;
      let isDragging = false;

      infoPanel.addEventListener('touchstart', (e) => {
          if (window.innerWidth >= 768) return;

          const isExpanded = infoPanel.classList.contains('expanded');
          const touchedContent = e.target.closest('#info-content');
          
          // Allow scrolling inner content when expanded unless at the top
          if (isExpanded && touchedContent && infoContent.scrollTop > 0) {
              return;
          }

          startY = e.touches[0].clientY;
          isDragging = true;

          // Grab the exact absolute translation state (in pixels)
          const style = window.getComputedStyle(infoPanel);
          const matrix = new DOMMatrixReadOnly(style.transform);
          startTranslateY = matrix.m42; 

          infoPanel.style.transition = 'none'; 
      }, { passive: true });

      infoPanel.addEventListener('touchmove', (e) => {
          if (!isDragging || window.innerWidth >= 768) return;
          
          const y = e.touches[0].clientY;
          const deltaY = y - startY;

          // Add the drag difference to our starting position
          let nextTranslateY = startTranslateY + deltaY;

          // Don't allow dragging higher than fully expanded (0px)
          nextTranslateY = Math.max(0, nextTranslateY);

          infoPanel.style.transform = `translateY(${nextTranslateY}px)`;
      }, { passive: true });

      infoPanel.addEventListener('touchend', (e) => {
          if (!isDragging || window.innerWidth >= 768) return;
          isDragging = false;
          
          infoPanel.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
          
          // Check final drag position
          const style = window.getComputedStyle(infoPanel);
          const matrix = new DOMMatrixReadOnly(style.transform);
          const finalTranslateY = matrix.m42; 

          const vh = window.innerHeight;
          const collapsedY = vh * 0.55; // Where the sheet rests when collapsed (55vh down)

          if (finalTranslateY < collapsedY - 60) {
              // Dragged far enough UP -> snap to expanded
              infoPanel.classList.add('expanded');
          } else if (finalTranslateY > collapsedY + 60) {
              // Dragged far enough DOWN -> snap to closed
              closePanel();
          } else {
              // Snap back to normal collapsed view
              infoPanel.classList.remove('expanded');
              infoPanel.classList.add('open');
          }
          
          // Clear inline styles so the CSS classes take over animation
          infoPanel.style.transform = ''; 
      });

      // === UI BUTTON LOGIC ===
      document.getElementById('btn-north').addEventListener('click', () => { map.resetNorthPitch(); });

      let isGlobe = true;
      const btnProj = document.getElementById('btn-proj');
      
      btnProj.addEventListener('click', () => {
        isGlobe = !isGlobe;
        map.setProjection({ type: isGlobe ? 'globe' : 'mercator' });
        btnProj.innerText = isGlobe ? '2D' : '3D';
        btnProj.title = isGlobe ? 'Switch to 2D Map' : 'Switch to Globe';
      });

      const aboutOverlay = document.getElementById('about-overlay');
      document.getElementById('btn-about').addEventListener('click', () => { aboutOverlay.style.display = 'flex'; });
      document.getElementById('close-about-btn').addEventListener('click', () => { aboutOverlay.style.display = 'none'; });
    </script>
  </body>
</html>
