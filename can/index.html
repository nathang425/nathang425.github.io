<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Testing</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/can/images/letter-7075493.png"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@200;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- MapLibre CSS -->
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />

    <!-- Deck.gl (standalone bundle) -->
    <script src="https://unpkg.com/deck.gl/dist.min.js"></script>

    <!-- Basic Internal CSS -->
    <style>
      /* Reset body and html to take up exact window size with no scrolling */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Noto Sans', sans-serif;
        background-color: #1e1e1e;
        color: #f0f0f0;
      }

      /* Map container takes over the entire screen behind the UI */
      #globe-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }

      /* Invisible overlay to hold the UI above the map */
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none; /* Mouse events pass through to map */
      }

      /* Heading styling */
      h1 {
        pointer-events: auto; /* Clickable/highlightable */
        background: rgba(30, 30, 30, 0.6);
        backdrop-filter: blur(4px);
        padding: 10px 20px;
        border-radius: 8px;
        margin: 20px auto;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        width: fit-content;
        font-weight: 700;
        color: #00ffff;
      }

      /* Left-side buttons container */
      #side-buttons {
        position: absolute;
        top: 50%;
        left: 20px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      /* Individual square buttons */
      .sq-btn {
        pointer-events: auto; /* Buttons must be clickable */
        width: 50px;
        height: 50px;
        border-radius: 12px;
        background: rgba(30, 30, 30, 0.8);
        border: 1px solid #444;
        color: #00ffff;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: background 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sq-btn:hover {
        background: rgba(60, 60, 60, 0.9);
      }

      .sq-btn:active {
        transform: scale(0.95);
      }

      /* Fullscreen About Overlay */
      #about-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(20, 20, 20, 0.95);
        z-index: 10;
        display: none; /* Hidden by default */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: auto; /* Block interactions with the map below */
      }

      #about-overlay h2 {
        color: #00ffff;
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      #about-overlay p {
        font-size: 1.2rem;
        max-width: 600px;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .links-container a {
        display: inline-block;
        color: #f0f0f0;
        text-decoration: none;
        margin: 0 15px;
        font-size: 1.1rem;
        border-bottom: 2px solid transparent;
        transition: border-color 0.2s;
      }

      .links-container a:hover {
        border-color: #00ffff;
      }

      /* Close X Button */
      #close-about-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background: none;
        border: none;
        color: #fff;
        font-size: 2rem;
        cursor: pointer;
        transition: color 0.2s;
      }

      #close-about-btn:hover {
        color: #00ffff;
      }
    </style>
  </head>
  <body>
    <!-- The Map -->
    <div id="globe-container"></div>

    <!-- The UI Overlay -->
    <div id="ui-overlay">
      <h1>Heading yay nice</h1>

      <div id="side-buttons">
        <button id="btn-north" class="sq-btn" title="North Up">N</button>
        <button id="btn-proj" class="sq-btn" title="Toggle Projection">
          2D
        </button>
        <button id="btn-about" class="sq-btn" title="About">i</button>
      </div>
    </div>

    <!-- Fullscreen About Overlay -->
    <div id="about-overlay">
      <button id="close-about-btn" title="Close">✕</button>
      <h2>About This Map</h2>
      <p>
        Welcome to the map! This space is reserved for information about the
        project, the data sources, or any other details you want to share with
        your users.
      </p>
      <div class="links-container">
        <a href="#">Home</a>
        <a href="#">Documentation</a>
        <a href="#">Contact Us</a>
      </div>
    </div>

    <script type="module">
      import * as maplibregl from 'https://unpkg.com/maplibre-gl/dist/maplibre-gl.mjs';
      import { Protocol } from 'https://unpkg.com/pmtiles@3/dist/index.js';

      // === YOUR CONFIGURATION ===
      const BASEMAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
      const INITIAL_CENTER = [-111.83, 40.62];
      const INITIAL_ZOOM = 1.5;

      const PMTILES_URL = new URL('./files/converted.pmtiles', window.location.href).href;
      const DATA_URL = new URL('./files/continent_data.json', window.location.href).href;

      // === FETCH EXTERNAL DATA ===
      let mapData = {};
      fetch(DATA_URL)
        .then(response => response.json())
        .then(data => {
            mapData = data;
        })
        .catch(err => console.error("Error loading external data:", err));
      // ==========================

      const protocol = new Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      const map = new maplibregl.Map({
          container: 'globe-container',
          style: BASEMAP_STYLE,
          center: INITIAL_CENTER,
          zoom: INITIAL_ZOOM
      });

      map.on('style.load', () => {
          map.setProjection({ type: 'globe' });

          map.addSource('my-pmtiles-source', {
              type: 'vector',
              url: `pmtiles://${PMTILES_URL}`
          });

          map.addLayer({
              id: 'my-pmtiles-layer',
              type: 'fill',
              source: 'my-pmtiles-source',
              'source-layer': 'continents_data',
              paint: {
                  'fill-color': '#00ffff',
                  'fill-opacity': 0.4,
                  'fill-outline-color': '#ffffff'
              }
          });
      });

      const deckOverlay = new deck.MapboxOverlay({ interleaved: true, layers: [] });
      map.addControl(deckOverlay);

      // === MAP INTERACTION (Popups) ===
      map.on('mouseenter', 'my-pmtiles-layer', () => {
          map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'my-pmtiles-layer', () => {
          map.getCanvas().style.cursor = '';
      });

      map.on('click', 'my-pmtiles-layer', (e) => {
          if (!e.features || e.features.length === 0) return;

          const feature = e.features[0];
          const name = feature.properties.CONTINENT || feature.properties.name || "Unknown";

          // Pull data from the dynamically fetched JSON
          const data = mapData[name] || {
              "Population": "Data unavailable",
              "Area": "Data unavailable",
              "Countries": "N/A"
          };

          const popupHtml = `
              <h3 class="popup-title">${name}</h3>
              <p class="popup-stat"><strong>Population:</strong> ${data.Population}</p>
              <p class="popup-stat"><strong>Area:</strong> ${data.Area}</p>
              <p class="popup-stat"><strong>Countries:</strong> ${data.Countries}</p>
          `;

          new maplibregl.Popup()
              .setLngLat(e.lngLat)
              .setHTML(popupHtml)
              .addTo(map);
      });

      // === UI BUTTON LOGIC ===
      document.getElementById('btn-north').addEventListener('click', () => {
        map.resetNorthPitch();
      });

      let isGlobe = true;
      const btnProj = document.getElementById('btn-proj');

      btnProj.addEventListener('click', () => {
        isGlobe = !isGlobe;
        map.setProjection({ type: isGlobe ? 'globe' : 'mercator' });
        btnProj.innerText = isGlobe ? '2D' : '3D';
        btnProj.title = isGlobe ? 'Switch to 2D Map' : 'Switch to Globe';
      });

      const aboutOverlay = document.getElementById('about-overlay');
      document.getElementById('btn-about').addEventListener('click', () => {
        aboutOverlay.style.display = 'flex';
      });
      document.getElementById('close-about-btn').addEventListener('click', () => {
        aboutOverlay.style.display = 'none';
      });
    </script>
  </body>
</html>
