<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Testing</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/can/images/letter-7075493.png"
    />
    <link rel="stylesheet" href="mestyle.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@200&display=swap"
      rel="stylesheet"
    />
    <!-- MapLibre CSS -->
    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <!-- Deck.gl (standalone bundle) -->
    <script src="https://unpkg.com/deck.gl/dist.min.js"></script>
  </head>
  <body>
    <h1>Heading yay nice</h1>
    <p>Here is the text</p>
    <div
      id="globe-container"
      style="width: 100%; height: 600px; border-radius: 8px; overflow: hidden; position: relative;"
    ></div>
    <p>Here is more text</p>
    <script type="module">
      // 1. Import maplibregl from the modern ES module URL
      import * as maplibregl from 'https://unpkg.com/maplibre-gl/dist/maplibre-gl.mjs';

      // === YOUR CONFIGURATION ===
      // Replace with your preferred MapLibre style JSON URL
      const BASEMAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
      const INITIAL_CENTER = [-111.83, 40.62]; // Longitude, Latitude
      const INITIAL_ZOOM = 1.5;
      // ==========================

      // 2. Initialize the MapLibre base map
      const map = new maplibregl.Map({
          container: 'globe-container',
          style: BASEMAP_STYLE,
          center: INITIAL_CENTER,
          zoom: INITIAL_ZOOM,
          projection: 'globe'
      });

      // 3. Initialize the deck.gl overlay
      const deckOverlay = new deck.MapboxOverlay({
          interleaved: true, // Weaves deck.gl layers into MapLibre's WebGL context
          layers: [
              // === ADD YOUR DECK.GL LAYERS HERE ===

              /* Example Layer:
              new deck.ScatterplotLayer({
                  id: 'test-layer',
                  data: [{ position: INITIAL_CENTER, size: 50000 }],
                  getPosition: d => d.position,
                  getRadius: d => d.size,
                  getFillColor: [255, 50, 50, 200]
              })
              */
          ]
      });

      // 4. Attach deck.gl to the map
      map.addControl(deckOverlay);
    </script>
  </body>
</html>
